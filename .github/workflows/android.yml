name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read 
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clone third-party submodules
      run: |
        git config --local url."https://github.com/".insteadOf "git@github.com:"
        
        if [ ! -d "terminal/src" ]; then
          git clone --depth 1 https://github.com/SelectXn00b/HermesTerminalCore.git terminal
        fi
        
        if [ ! -d "quickjs/thirdparty/quickjs/VERSION" ]; then
          mkdir -p quickjs/thirdparty && git clone --depth 1 https://github.com/bellard/quickjs.git quickjs/thirdparty/quickjs
        fi
        
        if [ ! -d "mmd/third_party/saba" ]; then
          mkdir -p mmd/third_party && git clone --depth 1 https://github.com/benikabocha/saba.git mmd/third_party/saba
        fi
        
        if [ ! -d "fbx/third_party/ufbx/ufbx.c" ]; then
          mkdir -p fbx/third_party && git clone --depth 1 https://github.com/ufbx/ufbx.git fbx/third_party/ufbx
        fi

    - name: Setup Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDebug --no-daemon 2>&1

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        files: app/build/outputs/apk/debug/*.apk
        generate_release_notes: true