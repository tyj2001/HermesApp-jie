name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read 
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix terminal submodule (SSH → HTTPS)
      run: |
        git config --local url."https://github.com/SelectXn00b/".insteadOf "git@github.com:SelectXn00b/"
        git submodule update --init --recursive terminal

    - name: Setup Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDebug --no-daemon 2>&1

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        files: app/build/outputs/apk/debug/*.apk
        generate_release_notes: true