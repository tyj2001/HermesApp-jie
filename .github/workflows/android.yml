name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read 
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Init all git submodules (SSH → HTTPS fix)
      run: |
        # Replace all SSH git@ URLs with HTTPS so they work on GitHub runners
        git config --local url."https://github.com/".insteadOf "git@github.com:"
        
        # Init each submodule individually (avoid --recursive to skip broken nested bullet3 ref)
        git submodule update --init terminal
        git submodule update --init mnn/src/main/cpp/MNN
        git submodule update --init llama/third_party/llama.cpp
        git submodule update --init mmd/third_party/saba
        git submodule update --init app/src/main/cpp/thirdparty/ncnn
        git submodule update --init app/src/main/cpp/thirdparty/sherpa-ncnn
        git submodule update --init quickjs/thirdparty/quickjs
        git submodule update --init fbx/third_party/ufbx
        
        # Clone bullet3 physics engine manually (nested submodule with missing URL in saba repo)
        if [ ! -d "mmd/third_party/bullet3" ]; then
          mkdir -p mmd/third_party/bullet3
          git clone --depth 1 https://github.com/bulletphysics/bullet3.git mmd/third_party/bullet3
        fi
        
        # Verify critical submodules
        echo "=== Checking critical submodules ==="
        ls -la terminal/src 2>/dev/null || echo "terminal MISSING"
        ls -la mnn/src/main/cpp/MNN 2>/dev/null || echo "MNN MISSING"
        ls -la mmd/third_party/saba 2>/dev/null || echo "saba MISSING"
        ls -la mmd/third_party/bullet3 2>/dev/null || echo "bullet3 MISSING"

    - name: Setup Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDebug --no-daemon 2>&1

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        files: app/build/outputs/apk/debug/*.apk
        generate_release_notes: true