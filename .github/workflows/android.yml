name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read 
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clone missing dependencies
      run: |
        # Replace SSH URLs with HTTPS for any git operations
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        
        # terminal is a regular folder in the repo, but empty - fill it
        if [ ! -f "terminal/build.gradle.kts" ]; then
          rm -rf terminal && git clone --depth 1 https://github.com/SelectXn00b/HermesTerminalCore.git terminal
        fi
        
        # MNN submodule - might be empty gitlink, re-clone if missing CMakeLists.txt
        if [ ! -f "mnn/src/main/cpp/MNN/CMakeLists.txt" ]; then
          rm -rf mnn/src/main/cpp/MNN && git clone --depth 1 https://github.com/alibaba/MNN.git mnn/src/main/cpp/MNN
        fi
        
        # llama.cpp
        if [ ! -f "llama/third_party/llama.cpp/CMakeLists.txt" ]; then
          rm -rf llama/third_party/llama.cpp && git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama/third_party/llama.cpp
        fi
        
        # saba + bullet3 for mmd
        if [ ! -f "mmd/third_party/saba/CMakeLists.txt" ]; then
          rm -rf mmd/third_party/saba && git clone --depth 1 https://github.com/benikabocha/saba.git mmd/third_party/saba
        fi
        if [ ! -f "mmd/third_party/bullet3/CMakeLists.txt" ]; then
          rm -rf mmd/third_party/bullet3 && git clone --depth 1 https://github.com/bulletphysics/bullet3.git mmd/third_party/bullet3
        fi
        
        # Other third-party deps
        [ -f "app/src/main/cpp/thirdparty/ncnn/CMakeLists.txt" ] || git clone --depth 1 https://github.com/Tencent/ncnn.git app/src/main/cpp/thirdparty/ncnn
        [ -f "app/src/main/cpp/thirdparty/sherpa-ncnn/CMakeLists.txt" ] || git clone --depth 1 https://github.com/k2-fsa/sherpa-ncnn.git app/src/main/cpp/thirdparty/sherpa-ncnn
        [ -f "quickjs/thirdparty/quickjs/VERSION" ] || git clone --depth 1 https://github.com/bellard/quickjs.git quickjs/thirdparty/quickjs
        [ -f "fbx/third_party/ufbx/ufbx.c" ] || git clone --depth 1 https://github.com/ufbx/ufbx.git fbx/third_party/ufbx
        
        echo "=== Dependency check ==="
        ls terminal/build.gradle.kts 2>/dev/null && echo "terminal OK" || echo "terminal MISSING"
        ls mnn/src/main/cpp/MNN/CMakeLists.txt 2>/dev/null && echo "MNN OK" || echo "MNN MISSING"
        ls mmd/third_party/saba/CMakeLists.txt 2>/dev/null && echo "saba OK" || echo "saba MISSING"
        ls mmd/third_party/bullet3/CMakeLists.txt 2>/dev/null && echo "bullet3 OK" || echo "bullet3 MISSING"

    - name: Setup Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDebug --no-daemon 2>&1

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        files: app/build/outputs/apk/debug/*.apk
        generate_release_notes: true